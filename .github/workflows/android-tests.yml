name: Android Tests

# Runs the whole test suite of the app in apks/ (or the sample app) on one Android version,
# split across 4 emulators at the same time.
# Runs on every push to apks/ or sample-app/, or: Actions tab -> "Android Tests" -> "Run workflow".

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [instrument, monkey, maestro]
        default: instrument
      events:
        description: "Random events per emulator (monkey mode)"
        default: "4000"
      api_level:
        description: "Android API level"
        default: "34"
  push:
    paths:
      - "apks/**"
      - "sample-app/**"
  pull_request:
    paths:
      - "apks/**"
      - "sample-app/**"
      - "test_bot.py"
      - "tools/**"
      - ".github/workflows/android-test.yml"

jobs:
  build:
    name: Get APKs (yours, or build the sample app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for your APK
        id: pick
        run: |
          if [ -f apks/app.apk ]; then echo "sample=false" >> "$GITHUB_OUTPUT"; echo "Using your apks/app.apk";
          else echo "sample=true" >> "$GITHUB_OUTPUT"; echo "No apks/app.apk found, building the sample app"; fi
      - uses: actions/setup-java@v6
        if: steps.pick.outputs.sample == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        if: steps.pick.outputs.sample == 'true'
        with:
          gradle-version: "8.11.1"
      - name: Build sample app and its tests
        if: steps.pick.outputs.sample == 'true'
        run: |
          gradle -p sample-app assembleDebug assembleDebugAndroidTest --no-daemon
          cp sample-app/app/build/outputs/apk/debug/app-debug.apk apks/app.apk
          cp sample-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk apks/test.apk
      - uses: actions/upload-artifact@v7
        with:
          name: apks
          path: apks/*.apk

  test:
    needs: build
    permissions:
      contents: write        # flaky-test history branch
      pull-requests: write   # results comment on pull requests
    uses: ./.github/workflows/android-test.yml
    with:
      apks-artifact: apks
      devices: single
      api-level: ${{ fromJSON(github.event.inputs.api_level || '34') }}
      shards: 4
      title: Sample app (Android ${{ github.event.inputs.api_level || '34' }}, 4 emulators)
      mode: ${{ github.event.inputs.mode || 'instrument' }}
      events: ${{ fromJSON(github.event.inputs.events || '4000') }}
      bot-repo: ${{ github.repository }}
      bot-ref: ${{ github.sha }}
    secrets: inherit
