name: Android Test Bot (reusable)

# Call this from any repo to test an app on Android emulators:
#
#   jobs:
#     build:  ... build your APKs, then upload them with actions/upload-artifact (name: apks)
#     test:
#       needs: build
#       uses: Dante3750/android-test-bot/.github/workflows/android-test.yml@v1
#       with:
#         apks-artifact: apks
#         devices: quick
#
# See README.md for every option.

on:
  workflow_call:
    inputs:
      apks-artifact:
        description: "Name of the artifact (uploaded earlier in the same run) holding your app APK and, optionally, the androidTest APK"
        type: string
        required: true
      app-apk:
        description: "File name of the app APK inside the artifact. Empty = find it automatically"
        type: string
        default: ""
      test-apk:
        description: "File name of the androidTest APK inside the artifact. Empty = any APK with 'androidTest' in its name"
        type: string
        default: ""
      devices:
        description: "quick (30 devices), full (104), single (one phone at api-level), or a JSON list like [{\"api\":34,\"device\":\"pixel_6\"}] (optional per device: target, arch)"
        type: string
        default: quick
      api-level:
        description: "Android API level used when devices is 'single'"
        type: number
        default: 34
      shards:
        description: "Split the tests on each device into this many parallel parts (use 2-8 for very big test suites)"
        type: number
        default: 1
      mode:
        description: "instrument (your androidTest tests), monkey (random taps), or maestro (YAML flows)"
        type: string
        default: instrument
      events:
        description: "Random events per device in monkey mode"
        type: number
        default: 4000
      flows:
        description: "Folder of Maestro flows in your repo (maestro mode)"
        type: string
        default: flows
      test-args:
        description: "Extra runner arguments, space separated, e.g. 'annotation=com.x.Smoke' or 'class=com.x.LoginTest'"
        type: string
        default: ""
      max-parallel:
        description: "Most emulators running at the same time"
        type: number
        default: 20
      device-timeout:
        description: "Minutes one emulator may take to boot and run its tests before it is stopped and retried on a fresh emulator (up to 50)"
        type: number
        default: 40
      bot-ref:
        description: "Which version of the bot to use (tag, branch or commit)"
        type: string
        default: v1
      bot-repo:
        description: "Where the bot lives"
        type: string
        default: Dante3750/android-test-bot
      title:
        description: "Name shown in the results, PR comment and notifications"
        type: string
        default: Android tests
      quarantine-file:
        description: "File in your repo listing known-flaky tests (one per line). They still run, but can't fail the build"
        type: string
        default: .github/flaky-tests.txt
      record-video:
        description: "Record the screen while failed tests rerun, so you can watch the failure"
        type: boolean
        default: true
      pr-comment:
        description: "Post the results as a comment on pull requests (needs pull-requests: write)"
        type: boolean
        default: true
      history:
        description: "Keep a flaky-test history on the android-test-history branch (needs contents: write)"
        type: boolean
        default: true
      notify-on:
        description: "When to send Telegram/Slack/Discord messages: failure, always or never"
        type: string
        default: failure
    secrets:
      TELEGRAM_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false
      SLACK_WEBHOOK:
        required: false
      DISCORD_WEBHOOK:
        required: false
    outputs:
      result:
        description: "passed, flaky or failed"
        value: ${{ jobs.summary.outputs.result }}

jobs:
  plan:
    name: Pick devices
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Pick devices
        id: plan
        env:
          DEVICES: ${{ inputs.devices }}
          API: ${{ inputs.api-level }}
          SHARDS: ${{ inputs.shards }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, sys
          spec, shards = os.environ["DEVICES"].strip(), max(1, int(os.environ["SHARDS"]))
          apis = list(range(24, 37))   # 24 = Android 7.0 ... 36 = Android 16
          if spec == "full":
              kinds = ["pixel", "pixel_xl", "pixel_3a", "pixel_4", "pixel_6", "pixel_7", "pixel_c", "pixel_tablet"]
              devs = [{"api": a, "device": d} for a in apis for d in kinds]
          elif spec == "quick":
              devs  = [{"api": a, "device": "pixel_6"} for a in apis]                    # every version, normal phone
              devs += [{"api": a, "device": "pixel"} for a in (24, 28, 31, 34, 36)]      # small phone
              devs += [{"api": a, "device": "pixel_7"} for a in (33, 34, 35, 36)]        # big phone
              devs += [{"api": a, "device": "pixel_3a"} for a in (26, 29)]               # budget phone
              devs += [{"api": a, "device": "pixel_c"} for a in (24, 28)]                # old tablet
              devs += [{"api": a, "device": "pixel_tablet"} for a in (30, 33, 35, 36)]   # new tablet
          elif spec == "single":
              devs = [{"api": int(os.environ["API"]), "device": "pixel_6"}]
          else:
              devs = json.loads(spec)
          for d in devs:
              # Google publishes no x86_64 "Google APIs" image for API 27, so use the plain Android one.
              d.setdefault("target", "default" if d["api"] == 27 else "google_apis")
              d.setdefault("arch", "x86_64")
              # Android 8+ gets more CPU and RAM (fewer "isn't responding" popups); Android 7/7.1 images
              # hang during boot with more than the default, so they keep it.
              d.setdefault("cores", 2 if d["api"] <= 25 else 3)
              d.setdefault("ram", "" if d["api"] <= 25 else "4096M")
          jobs = [dict(d, part=p, parts=shards) for d in devs for p in range(shards)]
          if len(jobs) > 256:
              sys.exit(f"{len(jobs)} jobs is more than GitHub's limit of 256. Use fewer devices or shards.")
          print("matrix=" + json.dumps({"include": jobs}))
          print(f"{len(devs)} device(s) x {shards} part(s) = {len(jobs)} job(s)", file=sys.stderr)
          EOF

  test:
    needs: plan
    name: API ${{ matrix.api }} ${{ matrix.device }}${{ matrix.parts > 1 && format(' part {0}', matrix.part) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      DEVICE_LABEL: API ${{ matrix.api }} - ${{ matrix.device }}
      BASE_ARGS: >-
        ${{ inputs.mode }} --apk apks/app.apk --test-apk apks/test.apk
        --flows ${{ inputs.flows }} --events ${{ inputs.events }}
        --shard ${{ matrix.part }}/${{ matrix.parts }} --out test-results
        --quarantine ${{ inputs.quarantine-file }}
        ${{ inputs.record-video && '--video' || '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Get the bot
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.bot-repo }}
          ref: ${{ inputs.bot-ref }}
          path: .android-test-bot

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.apks-artifact }}
          path: apks-in

      - name: Find the APKs
        env:
          APP_APK: ${{ inputs.app-apk }}
          TEST_APK: ${{ inputs.test-apk }}
          TEST_ARGS: ${{ inputs.test-args }}
          MODE: ${{ inputs.mode }}
        run: |
          mkdir -p apks
          # Test APK: has "androidTest" in its name (Gradle's default) or is called test.apk
          if [ -n "$TEST_APK" ]; then t=$(find apks-in -name "$TEST_APK" | head -1);
          else t=$(find apks-in -name '*.apk' | grep -Ei 'androidtest|/test\.apk$' | head -1); fi
          if [ -n "$APP_APK" ]; then a=$(find apks-in -name "$APP_APK" | head -1);
          else a=$(find apks-in -name '*.apk' | grep -Evi 'androidtest|/test\.apk$' | head -1); fi
          [ -z "$a" ] && { echo "::error::No app APK found in the artifact"; find apks-in; exit 1; }
          cp "$a" apks/app.apk; echo "App APK:  $a"
          if [ -n "$t" ]; then cp "$t" apks/test.apk; echo "Test APK: $t";
          elif [ "$MODE" = instrument ]; then
            echo "::error::mode 'instrument' needs the androidTest APK, but none was found in the artifact. Build it with ./gradlew assembleDebugAndroidTest and upload it too, set test-apk, or use mode monkey."
            find apks-in -name '*.apk'; exit 1
          else echo "No androidTest APK (fine for $MODE mode)"; fi
          ARGS=""
          for x in $TEST_ARGS; do ARGS="$ARGS --arg $x"; done
          echo "BOT_ARGS=$BASE_ARGS$ARGS" >> "$GITHUB_ENV"

      - name: Enable KVM (fast emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        if: inputs.mode == 'maestro'
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run test bot
        id: run1
        continue-on-error: true
        timeout-minutes: ${{ inputs.device-timeout }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.device }}
          cores: ${{ matrix.cores }}
          ram-size: ${{ matrix.ram }}
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 .android-test-bot/test_bot.py $BOT_ARGS

      # The emulator never started or the install broke (no tests ran): start a fresh emulator once.
      - name: Stop the stuck emulator
        if: steps.run1.outcome == 'failure' && hashFiles('test-results/TESTS_RAN') == ''
        run: |
          pkill -9 -f qemu-system || true
          pkill -9 -f "emulator -port" || true
          "$ANDROID_HOME/platform-tools/adb" kill-server || true
          sleep 3

      - name: Retry with a fresh emulator
        id: run2
        timeout-minutes: ${{ inputs.device-timeout }}
        if: steps.run1.outcome == 'failure' && hashFiles('test-results/TESTS_RAN') == ''
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.device }}
          cores: ${{ matrix.cores }}
          ram-size: ${{ matrix.ram }}
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -wipe-data
          script: rm -rf test-results && python3 .android-test-bot/test_bot.py $BOT_ARGS

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-api${{ matrix.api }}-${{ matrix.device }}-p${{ matrix.part }}
          path: test-results/

      - name: Final result
        if: always()
        run: |
          if [ "${{ steps.run2.outcome }}" = "failure" ]; then exit 1; fi
          if [ "${{ steps.run1.outcome }}" = "failure" ] && [ "${{ steps.run2.outcome }}" != "success" ]; then exit 1; fi
          echo "OK"

  summary:
    name: Summary
    needs: test
    if: always()
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.table.outputs.result }}
    steps:
      - name: Get the bot
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.bot-repo }}
          ref: ${{ inputs.bot-ref }}
          path: .android-test-bot

      - uses: actions/download-artifact@v4
        with:
          path: all
          pattern: report-api*

      - name: Results table
        id: table
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: ${{ inputs.title }}
        run: python3 .android-test-bot/tools/summary.py --reports all --out out --run-url "$RUN_URL" --title "$TITLE"

      - name: Comment on the pull request
        if: inputs.pr-comment && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Update the bot's earlier comment instead of adding a new one on every push
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.body | contains("<!-- android-test-bot -->")) | .id' | tail -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@out/comment.md > /dev/null && echo "Updated comment $id"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@out/comment.md > /dev/null && echo "Added a comment"
          fi

      - name: Update flaky-test history
        if: inputs.history && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        continue-on-error: true
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          url="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          for attempt in 1 2 3; do
            rm -rf hist
            if ! git clone -q --depth 1 --branch android-test-history "$url" hist 2>/dev/null; then
              git init -q -b android-test-history hist && git -C hist remote add origin "$url"
            fi
            python3 .android-test-bot/tools/history.py --history hist --reports all --sha "$GITHUB_SHA" \
              --ref "$GITHUB_REF_NAME" --event "$GITHUB_EVENT_NAME" --run-url "$RUN_URL" --repo "$REPO" > /dev/null
            git -C hist add -A
            git -C hist -c user.name="android-test-bot" -c user.email="android-test-bot@users.noreply.github.com" \
              commit -q -m "Test history: run $GITHUB_RUN_ID"
            if git -C hist push -q origin android-test-history; then
              echo "History updated: ${{ github.server_url }}/$REPO/blob/android-test-history/FLAKY.md"; exit 0
            fi
            echo "Someone else updated the history at the same time, trying again"; sleep $((attempt * 5))
          done
          echo "::warning::Could not update the test history"

      - name: Send notification
        if: inputs.notify-on != 'never'
        env:
          RESULT: ${{ steps.table.outputs.result }}
          NOTIFY_ON: ${{ inputs.notify-on }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python3 .android-test-bot/tools/notify.py out/notify.txt

      - name: Fail if tests failed
        if: steps.table.outputs.result == 'failed'
        run: |
          echo "::error::Some tests failed. See the table above."
          exit 1
