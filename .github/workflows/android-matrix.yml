name: Android Matrix (many devices)

# Tests the app in apks/ (or the sample app) on many Android versions and device types.
#   quick = 30 devices (~20-30 min)    full = 104 devices (1-2 hours)
# Actions tab -> "Android Matrix (many devices)" -> "Run workflow".

on:
  workflow_dispatch:
    inputs:
      devices:
        description: "How many devices"
        type: choice
        options: [quick, full]
        default: quick
      mode:
        description: "What to run on every device"
        type: choice
        options: [instrument, monkey, maestro]
        default: instrument
      events:
        description: "Random events per device (monkey mode)"
        default: "4000"

jobs:
  build:
    name: Get APKs (yours, or build the sample app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for your APK
        id: pick
        run: |
          if [ -f apks/app.apk ]; then echo "sample=false" >> "$GITHUB_OUTPUT"; echo "Using your apks/app.apk";
          else echo "sample=true" >> "$GITHUB_OUTPUT"; echo "No apks/app.apk found, building the sample app"; fi
      - uses: actions/setup-java@v6
        if: steps.pick.outputs.sample == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        if: steps.pick.outputs.sample == 'true'
        with:
          gradle-version: "8.11.1"
      - name: Build sample app and its tests
        if: steps.pick.outputs.sample == 'true'
        run: |
          gradle -p sample-app assembleDebug assembleDebugAndroidTest --no-daemon
          cp sample-app/app/build/outputs/apk/debug/app-debug.apk apks/app.apk
          cp sample-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk apks/test.apk
      - uses: actions/upload-artifact@v7
        with:
          name: apks
          path: apks/*.apk

  test:
    needs: build
    permissions:
      contents: write        # flaky-test history branch
      pull-requests: write   # results comment on pull requests
    uses: ./.github/workflows/android-test.yml
    with:
      apks-artifact: apks
      devices: ${{ github.event.inputs.devices || 'quick' }}
      title: Sample app on ${{ github.event.inputs.devices || 'quick' }} device list
      mode: ${{ github.event.inputs.mode || 'instrument' }}
      events: ${{ fromJSON(github.event.inputs.events || '4000') }}
      bot-repo: ${{ github.repository }}
      bot-ref: ${{ github.sha }}
    secrets: inherit
